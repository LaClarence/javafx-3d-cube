plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    // This helps Gradle handle the Module Path correctly
    id 'org.javamodularity.moduleplugin' version '1.8.15'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

javafx {
    version = "27"
    modules = [ 'javafx.controls', 'javafx.graphics' ]
}

application {
    mainModule = 'dev.lego.app'
    mainClass = 'dev.lego.app.Main'

    // Add this line to silence the native access warning
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // jvmArgs += '--enable-native-access=javafx.graphics'
}

tasks.register('jpackage', Exec) {
    dependsOn installDist
    commandLine 'jpackage',
        '--type', 'app-image',
        '--name', 'CubeDemo',
        '--input', "build/install/javafx-3d-cube/lib",
        '--main-jar', 'javafx-3d-cube.jar',
        '--main-class', 'dev.lego.app.Main',
        '--dest', 'build/jpackage',
        '--module-path', "build/install/javafx-3d-cube/lib",
        '--add-modules', 'dev.lego.app,javafx.controls,javafx.graphics'
}
